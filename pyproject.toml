[build-system]
requires = ["setuptools>=77.0.3", "Cython>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptofeed"
version = "2.5.0"
description = "Cryptocurrency Exchange Websocket Data Feed Handler"
readme = "README.md"
license = "XFree86-1.1"
authors = [
    {name = "Bryant Moscon", email = "bmoscon@gmail.com"}
]
keywords = [
    "cryptocurrency", "bitcoin", "btc", "feed handler", "market feed", "market data", "crypto assets",
    "Trades", "Tickers", "BBO", "Funding", "Open Interest", "Liquidation", "Order book", "Bid", "Ask",
    "fmfw.io", "Bitfinex", "bitFlyer", "AscendEX", "Bitstamp", "Blockchain.com", "Bybit",
    "Binance", "Binance Delivery", "Binance Futures", "Binance US", "BitMEX", "Coinbase", "Deribit", "EXX",
    "Gate.io", "Gemini", "HitBTC", "Huobi", "Huobi DM", "Huobi Swap", "Kraken",
    "Kraken Futures", "OKCoin", "OKX", "Poloniex", "ProBit", "Upbit"
]
classifiers = [
    "Intended Audience :: Developers",
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: AsyncIO",
]
requires-python = ">=3.12"
dependencies = [
    "requests>=2.18.4",
    "websockets>=14.1",
    "pyyaml",
    "aiohttp>=3.11.6",
    "aiofile>=2.0.0",
    "msgspec>=0.19.0",
    "uvloop ; platform_system!='Windows'",
    "order_book>=0.6.0",
    "aiodns>=1.1"
]

[project.optional-dependencies]
arctic = ["arctic", "pandas"]
gcp_pubsub = ["google_cloud_pubsub>=2.4.1", "gcloud_aio_pubsub"]
kafka = ["aiokafka>=0.7.0"]
mongo = ["motor"]
postgres = ["asyncpg"]
quasardb = ["quasardb", "numpy"]
rabbit = ["aio_pika", "pika"]
redis = ["hiredis", "redis>=4.5.1"]
zmq = ["pyzmq"]
all = [
    "arctic",
    "google_cloud_pubsub>=2.4.1",
    "gcloud_aio_pubsub",
    "aiokafka>=0.7.0",
    "motor",
    "asyncpg",
    "aio_pika",
    "pika",
    "hiredis",
    "redis>=4.5.1",
    "pyzmq",
]

[project.urls]
Homepage = "https://github.com/bmoscon/cryptofeed"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "redis",
    "ruff",
]

[tool.setuptools.packages.find]
include = ["cryptofeed*"]

[tool.setuptools.package-data]
cryptofeed = ["*.pyx"]

# For a debug build that keeps the runtime assertions, remove the CYTHON_WITHOUT_ASSERTIONS macro and rebuild
[[tool.setuptools.ext-modules]]
name = "cryptofeed.types"
sources = ["cryptofeed/types.pyx"]
define-macros = [["CYTHON_WITHOUT_ASSERTIONS", ""]]

[tool.cibuildwheel]
build = "cp312-* cp313-* cp314-*"
skip = "*-musllinux*"
test-command = "python -c \"from cryptofeed import FeedHandler; from cryptofeed.types import COMPILED_WITH_ASSERTIONS; assert COMPILED_WITH_ASSERTIONS is False\""

[tool.cibuildwheel.macos]
archs = ["arm64", "x86_64"]

[tool.ruff.lint]
select = ["E", "F", "W", "ASYNC"]
ignore = ["E501", "F403", "F405"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: unit tests",
    "playback: replay exchange data through message handlers",
    "backend: requires backend services",
    "live: hits exchange endpoints",
    "bench: performance tests and benchmarks",
]
addopts = "-m 'not live'"
asyncio_mode = "auto"
