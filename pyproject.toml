[build-system]
requires = ["setuptools>=77.0.3", "Cython>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptofeed"
version = "3.0.0"
description = "Cryptocurrency Exchange Websocket Data Feed Handler"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    {name = "Bryant Moscon", email = "bmoscon@gmail.com"}
]
keywords = [
    "cryptocurrency", "bitcoin", "btc", "feed handler", "market feed", "market data", "crypto assets",
    "Trades", "Tickers", "BBO", "Funding", "Open Interest", "Liquidation", "Order book", "Bid", "Ask",
    "Binance", "Binance Delivery", "Binance Futures", "Binance US", "Bitfinex", "bitFlyer", "Bitget",
    "Bithumb", "Bitstamp", "Bybit", "Coinbase", "Crypto.com", "Deribit", "Gate.io", "Gate.io Futures",
    "dYdX", "Gemini", "Hyperliquid", "HTX", "HTX Swap", "Independent Reserve", "Kraken", "Kraken Futures", "KuCoin", "MEXC",
    "OKX", "Phemex", "Poloniex", "Upbit"
]
classifiers = [
    "Intended Audience :: Developers",
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: AsyncIO",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
]
requires-python = ">=3.12"
dependencies = [
    "websockets>=14.1",
    "pyyaml",
    "aiohttp>=3.14.3",
    "msgspec>=0.19.0",
    "uvloop ; platform_system!='Windows'",
    "order_book>=1.0.2",
    "aiodns>=1.1",
    "zstandard>=0.23 ; python_version<'3.14'"
]

[project.optional-dependencies]
kafka = ["aiokafka>=0.7.0"]
mongo = ["pymongo>=4.9"]
postgres = ["asyncpg"]
redis = ["hiredis", "redis>=4.5.1"]
zmq = ["pyzmq"]
all = [
    "aiokafka>=0.7.0",
    "pymongo>=4.9",
    "asyncpg",
    "hiredis",
    "redis>=4.5.1",
    "pyzmq",
    "zstandard ; python_version < '3.14'",
]

[project.urls]
Homepage = "https://github.com/bmoscon/cryptofeed"

[dependency-groups]
dev = [
    "aiokafka>=0.13.0",
    "asyncpg>=0.31.0",
    "pymongo>=4.9",
    "pytest",
    "pytest-asyncio",
    "pytest-benchmark>=5.2.3",
    "pytest-timeout>=2.4.0",
    "pyzmq>=27.1.0",
    "redis",
    "ruff",
    "zstandard ; python_version < '3.14'",
]

[tool.setuptools.packages.find]
include = ["cryptofeed*"]

[tool.setuptools.package-data]
cryptofeed = ["*.pyx", "py.typed", "types.pyi"]

# For a debug build that keeps the runtime assertions, remove the CYTHON_WITHOUT_ASSERTIONS macro and rebuild
[[tool.setuptools.ext-modules]]
name = "cryptofeed.types"
sources = ["cryptofeed/types.pyx"]
define-macros = [["CYTHON_WITHOUT_ASSERTIONS", ""]]

[tool.cibuildwheel]
build = "cp312-* cp313-* cp314-*"
skip = "*t-* *musllinux*"
test-command = "python -c \"from cryptofeed import FeedHandler; from cryptofeed.types import COMPILED_WITH_ASSERTIONS; assert COMPILED_WITH_ASSERTIONS is False\""

[tool.cibuildwheel.macos]
archs = ["arm64"]

[tool.ruff.lint]
select = ["E", "F", "W", "ASYNC"]
ignore = ["E501", "F403", "F405"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
markers = [
    "unit: unit tests",
    "playback: replay recorded exchange data through the message handlers",
    "backend: requires backend services",
    "live: hits exchange endpoints",
    "bench: performance tests and benchmarks",
]
addopts = "-m 'not live'"
asyncio_mode = "auto"
# a replay that hangs should fail
timeout = 600
