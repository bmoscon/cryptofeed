[build-system]
requires = ["setuptools>=77.0.3", "Cython>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptofeed"
version = "2.5.0"
description = "Cryptocurrency Exchange Websocket Data Feed Handler"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    {name = "Bryant Moscon", email = "bmoscon@gmail.com"}
]
keywords = [
    "cryptocurrency", "bitcoin", "btc", "feed handler", "market feed", "market data", "crypto assets",
    "Trades", "Tickers", "BBO", "Funding", "Open Interest", "Liquidation", "Order book", "Bid", "Ask",
    "Binance", "Binance Delivery", "Binance Futures", "Binance US", "Bitfinex", "bitFlyer", "Bitget",
    "Bithumb", "Bitstamp", "Bybit", "Coinbase", "Crypto.com", "Deribit", "Gate.io", "Gate.io Futures",
    "Gemini", "Huobi", "Huobi Swap", "Independent Reserve", "Kraken", "Kraken Futures", "KuCoin",
    "OKX", "Phemex", "Poloniex", "Upbit"
]
classifiers = [
    "Intended Audience :: Developers",
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: AsyncIO",
]
requires-python = ">=3.12"
dependencies = [
    "requests>=2.18.4",
    "websockets>=14.1",
    "pyyaml",
    "aiohttp>=3.11.6",
    "aiofile>=2.0.0",
    "msgspec>=0.19.0",
    "uvloop ; platform_system!='Windows'",
    "order_book>=0.6.0",
    "aiodns>=1.1"
]

[project.optional-dependencies]
capture = ["zstandard ; python_version < '3.14'"]
kafka = ["aiokafka>=0.7.0"]
mongo = ["pymongo>=4.9"]
postgres = ["asyncpg"]
rabbit = ["aio_pika", "pika"]
redis = ["hiredis", "redis>=4.5.1"]
zmq = ["pyzmq"]
all = [
    "aiokafka>=0.7.0",
    "pymongo>=4.9",
    "asyncpg",
    "aio_pika",
    "pika",
    "hiredis",
    "redis>=4.5.1",
    "pyzmq",
]

[project.urls]
Homepage = "https://github.com/bmoscon/cryptofeed"

[dependency-groups]
dev = [
    "aio-pika>=9.5.8",
    "aiokafka>=0.13.0",
    "asyncpg>=0.31.0",
    "pymongo>=4.9",
    "pytest",
    "pytest-asyncio",
    "pytest-benchmark>=5.2.3",
    "pytest-timeout>=2.4.0",
    "pyzmq>=27.1.0",
    "redis",
    "ruff",
    "zstandard ; python_version < '3.14'",
]

[tool.setuptools.packages.find]
include = ["cryptofeed*"]

[tool.setuptools.package-data]
cryptofeed = ["*.pyx"]

# For a debug build that keeps the runtime assertions, remove the CYTHON_WITHOUT_ASSERTIONS macro and rebuild
[[tool.setuptools.ext-modules]]
name = "cryptofeed.types"
sources = ["cryptofeed/types.pyx"]
define-macros = [["CYTHON_WITHOUT_ASSERTIONS", ""]]

[tool.cibuildwheel]
build = "cp312-* cp313-* cp314-*"
skip = "*-musllinux*"
test-command = "python -c \"from cryptofeed import FeedHandler; from cryptofeed.types import COMPILED_WITH_ASSERTIONS; assert COMPILED_WITH_ASSERTIONS is False\""

[tool.cibuildwheel.macos]
archs = ["arm64", "x86_64"]

[tool.ruff.lint]
select = ["E", "F", "W", "ASYNC"]
ignore = ["E501", "F403", "F405"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# test orchestration polls with short sleeps on purpose
"tests/unit/test_lifecycle.py" = ["ASYNC110"]
"tests/unit/test_connection_handler.py" = ["ASYNC110"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# markers are applied by directory (tests/<layer>/) in tests/conftest.py
markers = [
    "unit: pure logic. offline, no services. tests/unit/",
    "playback: recorded captures replayed through real message handlers. offline. tests/playback/",
    "backend: round trips through real backend services. needs containers. tests/backend/",
    "live: connects to real exchange endpoints. nightly only, never gates a PR. tests/live/",
    "bench: performance benchmarks. run on demand and on release branches. tests/bench/",
]
addopts = "-m 'unit or playback'"
asyncio_mode = "auto"
# a hung socket or service connection should fail the test
timeout = 120
