name: build wheels

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  wheels:
    name: wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, macos-26]
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            /*
            !/sample_data
          sparse-checkout-cone-mode: false
          filter: blob:none
      # the interpreters, architectures and per-wheel test are configured under [tool.cibuildwheel] in pyproject.toml
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.1
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            /*
            !/sample_data
          sparse-checkout-cone-mode: false
          filter: blob:none
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
      - name: Build sdist
        run: uv build --sdist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: publish to PyPI
    needs: [wheels, sdist]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
