name: ruff lint

on: [push, pull_request]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: uv sync
      - name: ruff check
        run: uv run ruff check .
