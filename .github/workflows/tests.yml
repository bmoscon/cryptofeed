name: cryptofeed tests

on: [push, pull_request]

jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync
      - name: Run offline suite (unit + playback)
        run: uv run pytest -m 'unit or playback'

  # macOS covers the compiled types extension on the other supported platform
  offline-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: uv sync
      - name: Run offline suite (unit + playback)
        run: uv run pytest -m 'unit or playback'

  backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
      postgres:
        image: postgres:16
        ports: ['5432:5432']
        env:
          POSTGRES_PASSWORD: cryptofeed
          POSTGRES_USER: cryptofeed
          POSTGRES_DB: cryptofeed
        options: >-
          --health-cmd pg_isready
          --health-interval 5s --health-timeout 5s --health-retries 10
      mongo:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 10
      rabbitmq:
        image: rabbitmq:3-management
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s --health-timeout 10s --health-retries 10
      questdb:
        image: questdb/questdb:latest
        ports: ['9009:9009', '9000:9000']
      influxdb:
        image: influxdb:2
        ports: ['8086:8086']
        env:
          DOCKER_INFLUXDB_INIT_MODE: setup
          DOCKER_INFLUXDB_INIT_USERNAME: cryptofeed
          DOCKER_INFLUXDB_INIT_PASSWORD: cryptofeed123
          DOCKER_INFLUXDB_INIT_ORG: cryptofeed
          DOCKER_INFLUXDB_INIT_BUCKET: cryptofeed
          DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: cryptofeed-test-token
        options: >-
          --health-cmd "influx ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
      kafka:
        image: apache/kafka:latest
        ports: ['9092:9092']
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          CLUSTER_ID: cryptofeed-test-cluster
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: uv sync
      - name: Run backend suite
        run: uv run pytest -m backend
